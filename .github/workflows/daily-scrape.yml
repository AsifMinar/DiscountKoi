# Every morning at 6 AM Sudbury time: run the scraper, commit data/deals.json (and the
# price history) to main, then rebuild and publish the site.
#
# - GitHub cron uses UTC and Sudbury switches between EDT (UTC-4) and EST (UTC-5), so the
#   job fires at 10:00 and 11:00 UTC and scraper/time-gate.ts lets exactly one through:
#   it must be 6 AM or later in Sudbury and the scraper must not have run yet that day.
#   GitHub often starts scheduled runs hours late, so the gate accepts any time until
#   midnight, and the 16:00 UTC backup covers days when GitHub drops the morning runs.
# - "Run workflow" on the Actions tab runs it immediately and skips the time check.
# - The run fails (and GitHub emails you) if the scrape finds 0 deals or every source fails.

name: Daily scrape

on:
  schedule:
    - cron: "0 10 * * *" # 6:00 AM EDT (summer)
    - cron: "0 11 * * *" # 6:00 AM EST (winter)
    - cron: "0 16 * * *" # backup: noon EDT / 11 AM EST, in case both morning runs are dropped
  workflow_dispatch:

# Nothing by default; each job asks only for what it needs below.
permissions: {}

# Never two scrapes at once. A second run waits, then sees "already ran today" and stops.
concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape and save deals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # commit data/deals.json and data/price-history.json to main
    outputs:
      run: ${{ steps.gate.outputs.run }}
      sha: ${{ steps.save.outputs.sha }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Full history so the push can be replayed on top of main if it moved meanwhile.
          fetch-depth: 0
          # Keeps the job's token so it can push the updated data files.
          persist-credentials: true

      - name: Set up Node.js (version from .nvmrc)
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Restore cached node_modules
        id: modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Is it 6 AM in Sudbury? (scheduled runs only)
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            npm run --silent scrape:check-time
          else
            echo "Manual run: skipping the time check."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Does any source need a browser?
        id: browser
        if: steps.gate.outputs.run == 'true'
        run: npm run --silent scrape:needs-browser

      - name: Restore cached Chromium
        id: chromium
        if: steps.browser.outputs.browser == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.browser.outputs.browser == 'true' && steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium's system libraries
        if: steps.browser.outputs.browser == 'true' && steps.chromium.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Yesterday's ETag / Last-Modified cache, so unchanged pages come back as tiny 304s.
      - name: Restore the scraper's page cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: scraper-http-cache-${{ github.run_id }}
          restore-keys: scraper-http-cache-

      - name: Run the scraper
        if: steps.gate.outputs.run == 'true'
        env:
          # Only used once affiliate feeds are switched on (see docs/affiliate-setup.md).
          # Empty when the secret doesn't exist, which is fine.
          AFFILIATE_FEED_URLS: ${{ secrets.AFFILIATE_FEED_URLS }}
        run: npm run scrape

      - name: Commit the new deals to main
        id: save
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "Asif Minar"
          git config user.email "62024088+AsifMinar@users.noreply.github.com"
          git add data/deals.json data/price-history.json
          if git diff --cached --quiet; then
            echo "Nothing changed; nothing to commit."
          else
            git commit -m "Daily deals update $(TZ=America/Toronto date +%Y-%m-%d)"
            # If someone pushed to main during the scrape, replay this commit on top and retry once.
            git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Build and publish the site
    needs: scrape
    if: needs.scrape.outputs.run == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.scrape.outputs.sha }}
