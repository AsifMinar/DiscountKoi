# "Submit a deal" form. The site's Submit a deal button opens it.
# Nothing goes live until the owner runs `npm run approve-deal -- <issue number>`.
# If you rename a field label here, change FORM_LABELS in scraper/submissions.ts too
# (a test checks that they match).

name: Submit a deal
description: Share a deal, discount or freebie for Sudbury or Ontario. It's checked before it appears on Discount Koi.
title: "Deal: "
labels: ["deal submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping people in Sudbury save! Please only share deals that are public (a flyer, a store's website, a sign in the store) and still running.
        Everything here is public, so don't include personal information.

  - type: input
    id: name
    attributes:
      label: Deal or product name
      description: What it is, in a few words.
      placeholder: Chicken breast, boneless skinless
    validations:
      required: true

  - type: input
    id: store
    attributes:
      label: Store or business
      placeholder: No Frills (Lasalle Blvd)
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: Link to the deal
      description: The store's own page or flyer, starting with https://
      placeholder: https://
    validations:
      required: true

  - type: input
    id: original_price
    attributes:
      label: Original price
      description: The regular price, if you know it. Numbers only.
      placeholder: "5.99"

  - type: input
    id: sale_price
    attributes:
      label: Sale price
      description: Leave empty for free stuff or "% off" deals.
      placeholder: "3.99"

  - type: input
    id: size
    attributes:
      label: Size or unit
      description: The package size (4 L, 400 g, 12 eggs), or "per lb" / "per kg" for things sold by weight.
      placeholder: per lb

  - type: input
    id: end_date
    attributes:
      label: End date
      description: The last day of the deal, as YYYY-MM-DD. Leave empty if there isn't one.
      placeholder: "2026-10-28"

  - type: dropdown
    id: deal_type
    attributes:
      label: Deal type
      multiple: true
      options:
        - Online
        - In-store
        - Student
        - Free
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - "Food & Restaurants"
        - "Grocery"
        - "Gadgets & Electronics"
        - "Clothes & Fashion"
        - "Home & Furniture"
        - "Health & Beauty"
        - "Sports & Outdoors"
        - "Kids & Baby"
        - "Pets"
        - "Automotive"
        - "Entertainment & Events"
        - "Services"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: location
    attributes:
      label: Location
      description: Where can people get it?
      options:
        - Sudbury
        - Ontario
        - Ships to Ontario
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: The information is accurate and comes from a public source (a flyer, a store's website or the store itself).
          required: true
